    <!-- Structured data. The postal address matters more than usual here:
         in-person delivery across Chennai and Tamil Nadu is the part no larger
         firm will match, and local search is where that gets found. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "Halcyon",
        "url": "https://halcyon.uno/",
        "email": "sanjith@halcyon.uno",
        "description": "Halcyon builds bespoke operational software for manufacturing, construction, contracting and industrial supply businesses in India.",
        "founder": { "@type": "Person", "name": "Sanjith Dhandapani" },
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Plot No. 2041, 15th Main Road, H Block, Anna Nagar West",
          "addressLocality": "Chennai",
          "postalCode": "600040",
          "addressRegion": "Tamil Nadu",
          "addressCountry": "IN"
        },
        "areaServed": [
          { "@type": "State", "name": "Tamil Nadu" },
          { "@type": "Country", "name": "India" }
        ],
        "knowsAbout": [
          "Quotation and estimating systems",
          "Field staff tracking and proof of visit",
          "Government tender monitoring",
          "Production counting and scrap tracking",
          "Owner dashboards and cash visibility"
        ]
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- ═══════════════════════════════════════════════════════════════════
         AD TRACKING. Both fields are empty until you paste the IDs in, and
         nothing loads while they are empty, so the site stays clean until
         there is a campaign to measure.

         metaPixelId  Meta Events Manager → Data sources → your pixel.
                      A 15 to 16 digit number. This is the important one:
                      without it you cannot build a retargeting audience,
                      and retargeting converts several times better than cold
                      traffic does.
         ga4Id        Google Analytics → Admin → Data streams → Measurement
                      ID, in the form G-XXXXXXXXXX. Tells you where the
                      traffic came from.
         ═══════════════════════════════════════════════════════════════════ -->
    <script>
      window.HALCYON_ANALYTICS = {
        metaPixelId: '',
        ga4Id: '',
      }
    </script>
    <script>
      ;(function () {
        var cfg = window.HALCYON_ANALYTICS || {}

        if (cfg.metaPixelId) {
          !(function (f, b, e, v, n, t, s) {
            if (f.fbq) return
            n = f.fbq = function () {
              n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments)
            }
            if (!f._fbq) f._fbq = n
            n.push = n
            n.loaded = !0
            n.version = '2.0'
            n.queue = []
            t = b.createElement(e)
            t.async = !0
            t.src = v
            s = b.getElementsByTagName(e)[0]
            s.parentNode.insertBefore(t, s)
          })(window, document, 'script', 'https://connect.facebook.net/en_US/fbevents.js')
          fbq('init', cfg.metaPixelId)
          fbq('track', 'PageView')
        }

        if (cfg.ga4Id) {
          var g = document.createElement('script')
          g.async = true
          g.src = 'https://www.googletagmanager.com/gtag/js?id=' + cfg.ga4Id
          document.head.appendChild(g)
          window.dataLayer = window.dataLayer || []
          window.gtag = function () {
            window.dataLayer.push(arguments)
          }
          gtag('js', new Date())
          gtag('config', cfg.ga4Id, { send_page_view: false })
        }
      })()

      /* This site is a single page application, so the browser only ever loads
         once. Route changes have to be reported by hand or every visit looks
         like one page view of the home page. main.tsx calls this on navigation. */
      window.halcyonTrackPage = function (path) {
        try {
          if (window.fbq) fbq('track', 'PageView')
        } catch (e) {}
        try {
          if (window.gtag && window.HALCYON_ANALYTICS.ga4Id)
            gtag('event', 'page_view', { page_path: path })
        } catch (e) {}
      }

      /* Fired when the contact form actually succeeds, not when it is opened.
         This is the event that makes the pixel worth having: it teaches Meta
         what a real enquiry looks like, and it is what a campaign optimises
         toward. */
      window.halcyonTrackLead = function () {
        try {
          if (window.fbq) fbq('track', 'Lead')
        } catch (e) {}
        try {
          if (window.gtag) gtag('event', 'generate_lead')
        } catch (e) {}
      }

      /* Fired when a visitor opens a demo. Not a lead, but the strongest signal
         short of one, and worth a custom audience to retarget. */
      window.halcyonTrackDemo = function (slug) {
        try {
          if (window.fbq) fbq('trackCustom', 'OpenedDemo', { system: slug })
        } catch (e) {}
        try {
          if (window.gtag) gtag('event', 'opened_demo', { system: slug })
        } catch (e) {}
      }
    </script>

    <!-- Vercel Web Analytics. Needs no ID: switch it on in the Vercel dashboard
         under the project's Analytics tab. -->
    <script defer src="/_vercel/insights/script.js"></script>
  </head>
  <body>
    <div id="root"></div>
